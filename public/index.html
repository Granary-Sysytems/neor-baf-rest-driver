<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEOR REST — тест</title>
  <style>
    :root {
      --bg: #12151a;
      --panel: #1a1f27;
      --ink: #e8edf4;
      --muted: #8b96a8;
      --accent: #3d9a6a;
      --accent-dim: #2a6b4a;
      --warn: #c9a227;
      --err: #d45d5d;
      --line: #2a3340;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1e3a2f 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #243044 0%, transparent 50%),
        var(--bg);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0 0 0.25rem;
    }
    .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }
    section h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.75rem;
      font-weight: 600;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      color: var(--ink);
    }
    input[type="text"], select {
      background: #0f1318;
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
      font-size: 0.9rem;
      min-width: 12rem;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover { background: var(--accent-dim); }
    button.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.secondary:hover { border-color: var(--muted); }
    button.warn {
      background: transparent;
      color: var(--warn);
      border: 1px solid var(--warn);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #0f1318;
    }
    .pill.ok { border-color: var(--accent); color: #8fd4b0; }
    .pill.bad { border-color: var(--err); color: #f0a0a0; }
    .pill.idle { color: var(--muted); }
    pre {
      margin: 0;
      max-height: 220px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.4;
      background: #0f1318;
      border-radius: 6px;
      padding: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #c5d0e0;
    }
    .preview {
      margin-top: 0.75rem;
      min-height: 120px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1318;
      overflow: hidden;
    }
    .preview img {
      max-width: 100%;
      max-height: 520px;
      display: block;
    }
    .preview .hint { color: var(--muted); font-size: 0.9rem; padding: 1rem; }
    .msg {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .msg.err { color: #f0a0a0; }
    .msg.ok { color: #8fd4b0; }
  </style>
</head>
<body>
  <main>
    <h1>NEOR REST — тест камери</h1>
    <p class="sub">Локальний драйвер на <code>127.0.0.1:8787</code> · UVC + FFmpeg</p>

    <section>
      <h2>Стан</h2>
      <div class="row">
        <span id="healthPill" class="pill idle">health: —</span>
        <button type="button" class="secondary" id="btnHealth">Оновити health</button>
        <button type="button" class="secondary" id="btnDevices">Список пристроїв</button>
      </div>
      <pre id="devicesOut">Натисніть «Список пристроїв»</pre>
    </section>

    <section>
      <h2>Знімок</h2>
      <div class="row">
        <label>Серійний <input id="serial" type="text" value="DK50P30000422" /></label>
        <label>Формат
          <select id="format">
            <option value="jpeg" selected>jpeg</option>
            <option value="png">png</option>
          </select>
        </label>
        <label><input type="checkbox" id="autoCrop" checked /> autoCrop</label>
        <label><input type="checkbox" id="deskew" checked /> deskew</label>
        <label><input type="checkbox" id="enhance" checked /> enhance (AWB)</label>
        <label><input type="checkbox" id="raw" /> raw (без enhance)</label>
        <label>rotate
          <select id="rotate">
            <option value="auto" selected>auto</option>
            <option value="0">0</option>
            <option value="90">90</option>
            <option value="180">180</option>
            <option value="270">270</option>
            <option value="none">none</option>
          </select>
        </label>
        <label>warmupMs <input id="warmupMs" type="text" value="1800" style="min-width:5rem" /></label>
      </div>
      <div class="row">
        <button type="button" id="btnCapture">Зробити знімок</button>
        <button type="button" class="warn" id="btnLight">Підсвітка (очікується 501)</button>
      </div>
      <p id="captureMsg" class="msg"></p>
      <div class="preview" id="preview">
        <span class="hint">Зображення з’явиться тут після знімка</span>
      </div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let lastBlobUrl = null;

    function setHealth(ok, text) {
      const pill = $("healthPill");
      pill.className = "pill " + (ok === true ? "ok" : ok === false ? "bad" : "idle");
      pill.textContent = text;
    }

    async function refreshHealth() {
      try {
        const r = await fetch("/health");
        const j = await r.json();
        setHealth(r.ok, "health: " + (j.status || r.status));
      } catch (e) {
        setHealth(false, "health: помилка з’єднання");
      }
    }

    async function listDevices() {
      $("devicesOut").textContent = "Завантаження…";
      try {
        const r = await fetch("/api/v1/devices");
        const j = await r.json();
        $("devicesOut").textContent = JSON.stringify(j, null, 2);
      } catch (e) {
        $("devicesOut").textContent = String(e);
      }
    }

    async function capture() {
      const serial = $("serial").value.trim() || "DK50P30000422";
      const format = $("format").value;
      const autoCrop = $("autoCrop").checked;
      const deskew = $("deskew").checked;
      const enhance = $("enhance").checked;
      const raw = $("raw").checked;
      const rotate = $("rotate").value;
      const warmupRaw = $("warmupMs").value.trim();
      const warmupMs = warmupRaw === "" ? undefined : Number.parseInt(warmupRaw, 10);
      const msg = $("captureMsg");
      msg.className = "msg";
      msg.textContent = "Зйомка…";
      const preview = $("preview");
      try {
        const body = { format, autoCrop, deskew, enhance, raw, rotate };
        if (Number.isFinite(warmupMs) && warmupMs >= 0) body.warmupMs = warmupMs;
        const r = await fetch("/api/v1/devices/" + encodeURIComponent(serial) + "/capture", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "image/*" },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          const code = err?.error?.code || r.status;
          const m = err?.error?.message || r.statusText;
          msg.className = "msg err";
          msg.textContent = code + ": " + m;
          return;
        }
        const blob = await r.blob();
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(blob);
        preview.innerHTML = "";
        const img = document.createElement("img");
        img.alt = "Знімок";
        img.src = lastBlobUrl;
        preview.appendChild(img);
        const w = r.headers.get("X-Image-Width");
        const h = r.headers.get("X-Image-Height");
        const applied = r.headers.get("X-Postprocess-Applied");
        const method = r.headers.get("X-Postprocess-Method");
        const conf = r.headers.get("X-Postprocess-Confidence");
        const reason = r.headers.get("X-Postprocess-Reason");
        const lum = r.headers.get("X-Capture-Mean-Luminance");
        const warm = r.headers.get("X-Capture-Warmup-Ms");
        const backend = r.headers.get("X-Capture-Backend");
        const enh = r.headers.get("X-Postprocess-Enhanced");
        const rot = r.headers.get("X-Postprocess-Rotation");
        const sharp = r.headers.get("X-Postprocess-Sharpness");
        const focus = r.headers.get("X-Postprocess-Focus");
        const parts = [
          "OK",
          blob.type,
          w && h ? w + "×" + h : null,
          backend ? "via=" + backend : null,
          lum ? "luma=" + lum : null,
          warm != null && warm !== "" ? "warmup=" + warm + "ms" : null,
          enh === "true" ? "enhance=on" : enhance || autoCrop ? "enhance=off" : null,
          rot != null && rot !== "" ? "rot=" + rot + "°" : null,
          sharp ? "sharp=" + sharp : null,
          focus ? "focus=" + focus : null,
        ];
        if (applied === "true") {
          parts.push("crop=yes", method, conf ? "conf=" + conf : null);
        } else if (autoCrop || deskew) {
          parts.push("crop=no", reason || method || "fallback");
          if (conf) parts.push("conf=" + conf);
        }
        msg.className = applied === "false" && (autoCrop || deskew) ? "msg err" : "msg ok";
        msg.textContent = parts.filter(Boolean).join(" · ");
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = String(e);
      }
    }

    async function tryLight() {
      const serial = $("serial").value.trim() || "DK50P30000422";
      const msg = $("captureMsg");
      msg.className = "msg";
      msg.textContent = "Запит підсвітки…";
      try {
        const r = await fetch("/api/v1/devices/" + encodeURIComponent(serial) + "/light", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ on: true }),
        });
        const j = await r.json().catch(() => ({}));
        if (r.status === 501) {
          msg.className = "msg err";
          msg.textContent =
            "501 " + (j?.error?.code || "LIGHT_UNSUPPORTED") + " — " +
            (j?.error?.message || "підсвітка на macOS UVC недоступна");
          return;
        }
        msg.className = r.ok ? "msg ok" : "msg err";
        msg.textContent = r.status + " " + JSON.stringify(j);
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = String(e);
      }
    }

    $("btnHealth").addEventListener("click", refreshHealth);
    $("btnDevices").addEventListener("click", listDevices);
    $("btnCapture").addEventListener("click", capture);
    $("btnLight").addEventListener("click", tryLight);
    refreshHealth();
    listDevices();
  </script>
</body>
</html>
